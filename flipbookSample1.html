<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .full-iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      border: none;
      z-index: 1;
    }

    .back-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 2;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .back-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }
  </style>
</head>

<body>

  <button class="back-btn" onclick="goBack()">← Back</button>

  <iframe 
    class="full-iframe"
    src="https://heyzine.com/flip-book/85ac90e449.html"
    allowfullscreen>
  </iframe>

  <script>
    function goBack() {
      // If user came from another page → go back
      if (history.length > 1) {
        history.back();
      } else {
        // fallback → redirect to your home page
        window.location.href = "index.html";
      }
    }
  </script>

</body>
</html>
