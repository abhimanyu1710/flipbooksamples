<div style="position: relative; width: 100%; height: 100vh; overflow: hidden;">

  <!-- Back Button -->
  <button onclick="goBack()" 
    style="
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(6px);
    ">
    ← Back
  </button>

  <!-- Canva Embed -->
  <iframe 
    loading="lazy"
    style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none;"
    src="https://www.canva.com/design/DAHHkj73ql8/TOZWXyHxKv5fBLTRmYIgrg/view?embed"
    allowfullscreen>
  </iframe>

</div>

<script>
  function goBack() {
    if (history.length > 1) {
      history.back();
    } else {
      window.location.href = "index.html";
    }
  }
</script>
